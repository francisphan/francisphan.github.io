<header class="topnav">
  <div class="wrap topnav-inner">
    <a class="brand" href="/">Francis Phan</a>
    <nav>
      <a href="/#experience">Experience</a>
      <a href="/projects/"{% if page.url == '/projects/' %} class="active"{% endif %}>Projects</a>
      <a href="/#skills">Skills</a>
      <a href="/photos/"{% if page.url == '/photos/' %} class="active"{% endif %}>Photos</a>
      <button class="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch theme">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </nav>
  </div>
</header>

<script>
  (function () {
    var root = document.documentElement;
    var btn = document.querySelector('.theme-toggle');
    function sync() {
      var light = root.dataset.theme === 'light';
      btn.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
    }
    btn.addEventListener('click', function () {
      var next = root.dataset.theme === 'light' ? 'dark' : 'light';
      if (next === 'light') root.dataset.theme = 'light'; else delete root.dataset.theme;
      try { localStorage.setItem('theme', next); } catch (e) {}
      sync();
    });
    sync();
  })();
</script>
