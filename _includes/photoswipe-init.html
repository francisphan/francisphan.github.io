<script type="module">
  import PhotoSwipeLightbox from '/assets/js/photoswipe/photoswipe-lightbox.esm.min.js';

  const lightbox = new PhotoSwipeLightbox({
    gallery: '#gallery',
    children: 'a',
    pswpModule: () => import('/assets/js/photoswipe/photoswipe.esm.min.js'),

    bgOpacity: 0.95,
    showHideAnimationType: 'zoom',
  });

  // Show the photo's caption (if it has one) at the bottom of the lightbox.
  lightbox.on('uiRegister', () => {
    lightbox.pswp.ui.registerElement({
      name: 'custom-caption',
      order: 9,
      isButton: false,
      appendTo: 'root',
      onInit: (el, pswp) => {
        pswp.on('change', () => {
          const caption = pswp.currSlide.data.element?.querySelector('.pswp-caption-content');
          el.textContent = caption ? caption.textContent.trim() : '';
        });
      },
    });
  });

  lightbox.init();
</script>
