# Programming portfolio, in display order (the homepage shows the first six).
# Each entry renders as a card on /projects/:
# `cmd` is the project's real invocation, shown in the card's terminal header.
# `image` (optional) replaces the terminal header with a screenshot.
# `private` (instead of `repo`) labels a project whose code isn't public.
- name: "agent-b"
  repo: "https://github.com/francisphan/agent-b"
  image: "/images/projects/agent-b.jpg"
  image_alt: "agent-b architecture: Claude Desktop and a Slack assistant connect to the agent-b MCP server (OAuth, token-gated writes, guest 360), which fans out to Salesforce, NetSuite, Pardot and OPERA PMS"
  lang: "Python"
  lang_color: "#3572A5"
  kind: "MCP server"
  prompt: ">"
  cmd: "guest_360_profile(\"guest@example.com\")"
  description: "An MCP server that gives AI clients tools over Salesforce, NetSuite, Pardot, and OPERA PMS — composite lookups like a full guest 360, with write operations gated behind a token and OAuth for Claude Desktop."

- name: "Cadencia"
  private: "Private repo"
  image: "/images/projects/cadencia.jpg"
  image_alt: "Cadencia's Rocks list for a simulated company: quarterly rocks grouped by owner, with Complete, On Track and Off Track statuses and milestone progress bars"
  lang: "TypeScript"
  lang_color: "#3178C6"
  kind: "Internal web app"
  prompt: "$"
  cmd: "pnpm dev"
  description: "An in-house EOS platform that replaced a ~$14K-a-year subscription for under $2K a year. Weekly L10 meetings, Rocks, Scorecard, V/TO, accountability chart and one-on-ones for all ~100 staff, in English and Spanish. Next.js and Postgres (Supabase, Drizzle), deployed to Cloud Run."

- name: "Pung"
  repo: "https://github.com/francisphan/pung"
  live: "https://francisphan.github.io/pung/"
  image: "/images/projects/pung.jpg"
  image_alt: "A hand of Pung in progress: the East round card and recent discards on the table, a Chow offer on Ling's Five of bamboo, and the player's thirteen tiles"
  lang: "TypeScript"
  lang_color: "#3178C6"
  kind: "Browser game"
  prompt: "$"
  cmd: "npm run dev"
  description: "Hong Kong mahjong in the browser, solo against three bots or online with friends over WebRTC with no server needed. A guided round and five short lessons teach newcomers to play."

- name: "Guest Sync (OPERA → Salesforce)"
  repo: "https://github.com/francisphan/opera-file-sync"
  image: "/images/projects/guest-sync.jpg"
  image_alt: "Guest Sync architecture: polls OPERA PMS's on-prem Oracle database, scores duplicates, and upserts guest records into Salesforce, with pause-and-replay and automated deploys"
  lang: "JavaScript"
  lang_color: "#f1e05a"
  kind: "Integration service"
  prompt: "$"
  cmd: "npm run dry-run"
  description: "Syncs hotel guest records from OPERA PMS's Oracle database into Salesforce. Duplicate detection by probability scoring across name, location, and stay dates; ships as a single executable running as a Windows service."

- name: "Sideout"
  repo: "https://github.com/francisphan/sideout"
  live: "https://francisphan.github.io/sideout/"
  image: "/images/projects/sideout.jpg"
  image_alt: "Sideout's animated court during serve receive: the libero, opposite and outside hitters in passing stance, a dashed line tracing the pass up to the setter at the net, and hitters' approach lines"
  lang: "TypeScript"
  lang_color: "#3178C6"
  kind: "Interactive lessons"
  prompt: "$"
  cmd: "npm run dev"
  description: "Teaches volleyball rotations, serve receive and floor defense on an animated court. Step through each rotation and every phase of a rally, drag players to see when they break the overlap rule, and switch between a perspective view and a top-down whiteboard view."

- name: "Sabueso"
  repo: "https://github.com/francisphan/Sabueso"
  lang: "Python"
  lang_color: "#3572A5"
  kind: "AI guest profiles"
  prompt: "$"
  cmd: "python src/main.py --now"
  description: "Builds a profile of every arriving guest before check-in from Salesforce stays and Gemini web research, so hotel, resort and restaurant staff can tailor the visit. A Slack bot answers staff questions about any guest."

- name: "Tomo"
  repo: "https://github.com/francisphan/Tomo"
  live: "https://francisphan.github.io/Tomo/"
  live_label: "Arc guide"
  lang: "Go"
  lang_color: "#00ADD8"
  kind: "CLI + desktop app"
  prompt: "$"
  cmd: "tomo search \"tower of god\""
  description: "Downloads manga and manhwa series as CBZ archives for offline reading on an iPad. Pluggable per-site scrapers, concurrent page fetching, resumable downloads — plus a Tauri desktop wrapper that bundles the CLI as a sidecar. A static arc guide lists the chapter ranges of each story arc, for quick rereads."

- name: "Peyto"
  repo: "https://github.com/francisphan/Peyto"
  image: "/images/projects/peyto.jpg"
  image_alt: "Peyto in demo mode: two sample wine producer accounts, sync and inventory actions, and an activity log reporting low-stock items"
  lang: "TypeScript"
  lang_color: "#3178C6"
  kind: "Desktop app"
  prompt: "$"
  cmd: "npm run tauri:dev"
  description: "Cross-platform desktop app for managing wine inventory across multiple Vinoshipper producer accounts via CSV sync. React and TypeScript up front, a Rust backend behind Tauri, credentials kept in the OS keyring."

- name: "opera-to-salesforce-sync"
  repo: "https://github.com/francisphan/opera-to-salesforce-sync"
  lang: "TypeScript"
  lang_color: "#3178C6"
  kind: "Serverless pipeline"
  prompt: "$"
  cmd: "sam build && sam deploy"
  description: "Event-driven counterpart to the polling sync: OPERA business events hit a webhook Lambda, queue through SQS with retries and a dead-letter queue, and land in Salesforce."

- name: "netsuite-shim"
  repo: "https://github.com/francisphan/netsuite-shim"
  lang: "Python"
  lang_color: "#3572A5"
  kind: "Library"
  prompt: ">>>"
  cmd: "client.suiteql.query(\"SELECT …\")"
  description: "A thin, typed Python client for NetSuite's REST API, SuiteQL, and metadata discovery. OAuth 1.0 and 2.0 auth, with mirrored sync and async APIs."

- name: "slack-daily-pulse-bot"
  repo: "https://github.com/francisphan/slack-daily-pulse-bot"
  lang: "TypeScript"
  lang_color: "#3178C6"
  kind: "Slack bot"
  prompt: "$"
  cmd: "npm start"
  description: "Sends the team daily scorecard check-ins on Slack, follows up with anyone who hasn't answered, and rolls the responses into weekly summaries — real data for the scorecard instead of self-reporting."
