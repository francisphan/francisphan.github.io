# Programming portfolio, in display order (the homepage shows the first six).
# Each entry renders as a card on /projects/:
# `cmd` is the project's real invocation, shown in the card's terminal header.
# `image` (optional) replaces the terminal header with a screenshot.
# `private` (instead of `repo`) labels a project whose code isn't public.
- name: "agent-b"
  repo: "https://github.com/francisphan/agent-b"
  lang: "Python"
  lang_color: "#3572A5"
  kind: "MCP server"
  prompt: ">"
  cmd: "guest_360_profile(\"guest@example.com\")"
  description: "An MCP server that gives AI clients tools over Salesforce, NetSuite, Pardot, and OPERA PMS — composite lookups like a full guest 360, with write operations gated behind a token and OAuth for Claude Desktop."

- name: "Cadencia"
  private: "Private repo"
  lang: "TypeScript"
  lang_color: "#3178C6"
  kind: "Internal web app"
  prompt: "$"
  cmd: "pnpm dev"
  description: "An in-house EOS platform that replaced a ~$14K-a-year subscription for under $2K a year. Weekly L10 meetings, Rocks, Scorecard, V/TO, accountability chart and one-on-ones for all ~100 staff, in English and Spanish. Next.js and Postgres (Supabase, Drizzle), deployed to Cloud Run."

- name: "opera-file-sync"
  repo: "https://github.com/francisphan/opera-file-sync"
  lang: "JavaScript"
  lang_color: "#f1e05a"
  kind: "Integration service"
  prompt: "$"
  cmd: "npm run dry-run"
  description: "Syncs hotel guest records from OPERA PMS's Oracle database into Salesforce. Duplicate detection by probability scoring across name, location, and stay dates; ships as a single executable running as a Windows service."

- name: "Sabueso"
  repo: "https://github.com/francisphan/Sabueso"
  lang: "Python"
  lang_color: "#3572A5"
  kind: "AI research pipeline"
  prompt: "$"
  cmd: "python src/main.py --now"
  description: "Guest intelligence for a wine hotel: pulls arriving guests from Salesforce, researches each one with Gemini and Google Search grounding, validates headshots with Claude vision, and emails an HTML briefing before check-in."

- name: "Pung"
  repo: "https://github.com/francisphan/pung"
  live: "https://francisphan.github.io/pung/"
  image: "/images/projects/pung.jpg"
  image_alt: "A hand of Pung in progress: three bots around the table, discards in the middle, and a Chow offer above the player's tiles"
  lang: "TypeScript"
  lang_color: "#3178C6"
  kind: "Browser game"
  prompt: "$"
  cmd: "npm run dev"
  description: "Hong Kong mahjong in the browser — solo against three bots, or online with friends over WebRTC with no server needed. A pure, serialisable game engine shared by browser and optional table server, bots that read shanten, and a guided round plus five-lesson primer for newcomers."

- name: "Tomo"
  repo: "https://github.com/francisphan/Tomo"
  lang: "Go"
  lang_color: "#00ADD8"
  kind: "CLI + desktop app"
  prompt: "$"
  cmd: "tomo search \"tower of god\""
  description: "Downloads manga and manhwa series as CBZ archives for offline reading on an iPad. Pluggable per-site scrapers, concurrent page fetching, resumable downloads — plus a Tauri desktop wrapper that bundles the CLI as a sidecar."

- name: "Peyto"
  repo: "https://github.com/francisphan/Peyto"
  lang: "TypeScript"
  lang_color: "#3178C6"
  kind: "Desktop app"
  prompt: "$"
  cmd: "npm run tauri:dev"
  description: "Cross-platform desktop app for managing wine inventory across multiple Vinoshipper producer accounts via CSV sync. React and TypeScript up front, a Rust backend behind Tauri, credentials kept in the OS keyring."

- name: "opera-to-salesforce-sync"
  repo: "https://github.com/francisphan/opera-to-salesforce-sync"
  lang: "TypeScript"
  lang_color: "#3178C6"
  kind: "Serverless pipeline"
  prompt: "$"
  cmd: "sam build && sam deploy"
  description: "Event-driven counterpart to the polling sync: OPERA business events hit a webhook Lambda, queue through SQS with retries and a dead-letter queue, and land in Salesforce."

- name: "netsuite-shim"
  repo: "https://github.com/francisphan/netsuite-shim"
  lang: "Python"
  lang_color: "#3572A5"
  kind: "Library"
  prompt: ">>>"
  cmd: "client.suiteql.query(\"SELECT …\")"
  description: "A thin, typed Python client for NetSuite's REST API, SuiteQL, and metadata discovery. OAuth 1.0 and 2.0 auth, with mirrored sync and async APIs."

- name: "slack-daily-pulse-bot"
  repo: "https://github.com/francisphan/slack-daily-pulse-bot"
  lang: "TypeScript"
  lang_color: "#3178C6"
  kind: "Slack bot"
  prompt: "$"
  cmd: "npm start"
  description: "Sends the team daily scorecard check-ins on Slack, follows up with anyone who hasn't answered, and rolls the responses into weekly summaries — real data for the scorecard instead of self-reporting."
